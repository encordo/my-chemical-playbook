services:
  app:
    container_name: ${APP_HOST}
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres   # dentro de la red de Docker, el host es el nombre del servicio
      POSTGRES_PORT: 5432       # dentro de la red de Docker, Postgres siempre escucha en el 5432
      APP_PORT: 3000            # el servidor escucha en el 3000 dentro del contenedor (APP_PORT de .env es el puerto del host)
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
  mongo:
    container_name: servidor-mongo
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mi-contraseña
      MONGO_INITDB_DATABASE: bootcamp_db
    ports:
      - "27017:27017"
    volumes:
      - ./database/scripts:/docker-entrypoint-initdb.d:ro
      - mongo_data:/data/db

