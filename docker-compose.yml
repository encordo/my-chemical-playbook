services:
  app:
    container_name: ${APP_HOST}
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service healthy #No arranca la API hasta que Mongo responda

  mongo:
    container_name: servidor-mongo
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: $F{MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ./database/scripts:/docker-entrypoint-initdb.d:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

